var app=firebase.initializeApp(firebaseConfig);var db=firebase.database();
var dataList=[];var dataFiltered=[];var editIndex=-1;var selectedHobbies=[];var currentKK="";
var kodeData={gol:{"-":"-","A":"A","B":"B","AB":"AB","O":"O"},rumah:{"Milik Sendiri":"Milik Sendiri"},alamat:{"Tetap":"Tetap","Kontrak":"Kontrak"},status_keluarga:{"Kepala Keluarga":"Kepala Keluarga","Istri":"Istri","Anak":"Anak","Menantu":"Menantu","Cucu":"Cucu","Orang Tua":"Orang Tua","Mertua":"Mertua","Famili Lain":"Famili Lain"},hobby:{"Menjahit":"Menjahit","Bangunan":"Bangunan","Kelistrikan":"Kelistrikan","Otomotif":"Otomotif","Bahasa Asing":"Bahasa Asing","Fotografi":"Fotografi","Tukang Kayu":"Tukang Kayu","Bela Diri":"Bela Diri","Sepak Bola":"Sepak Bola","Bulutangkis":"Bulutangkis","Yoga":"Yoga","Menyanyi":"Menyanyi","Musik":"Musik","Lain-lain":"Lain-lain"}};
var PATH="STEVEN";var form=document.getElementById("formWarga");var noKKInput=document.getElementById("no_kk");var selectStatusKeluarga=document.getElementById("selectStatusKeluarga");
function renderStatusKeluargaDropdown(isKKBaru){
  var select=document.getElementById("selectStatusKeluarga");var valLama=select.value;select.innerHTML="";
  if(isKKBaru){
    select.innerHTML='<option value="Kepala Keluarga">Kepala Keluarga</option>';
    document.getElementById("warningKK").innerText="KK Baru! Wajib Kepala Keluarga";
    document.getElementById("infoKK").innerText="";

  } else {
    select.innerHTML="<option value=''>-Pilih-</option>";
    for(var key in kodeData.status_keluarga){select.innerHTML+='<option value="'+key+'">'+kodeData.status_keluarga[key]+'</option>';}

noKKInput.addEventListener("blur",function(){
  var no_kk=this.value.trim();if(!no_kk) return;currentKK=no_kk;
  var anggotaKK=dataList.filter(function(d){return d.no_kk===no_kk;});

  else{renderStatusKeluargaDropdown(true);selectStatusKeluarga.value="Kepala Keluarga";}
});
db.ref(PATH+"/STEVEN_dataWarga").on("value",function(snapshot){
  var val=snapshot.val();

function saveKodeData(){db.ref(PATH+"/STEVEN_kodeData").set(kodeData);}
document.getElementById("inputFoto").addEventListener("change",function(){

  if(hari<0){bulan--;hari+=new Date(now.getFullYear(),now.getMonth(),0).getDate();}if(bulan<0){tahun--;bulan+=12;}

});
document.getElementById("selectHobby").addEventListener("change",function(){
  var val=this.value;if(val &&!selectedHobbies.find(function(h){return h.nama===val;})){
    if(["Bahasa Asing","Bela Diri","Musik","Lain-lain"].indexOf(val)>=0){document.getElementById("hobbyTambahan").style.display="block";return;}
    selectedHobbies.push({nama:val,detail:""});renderHobby();this.value="";
  }
});
document.getElementById("hobbyTambahan").addEventListener("blur",function(){

});
function renderHobby(){var wrap=document.getElementById("hobbyList");wrap.innerHTML="";selectedHobbies.forEach(function(h,i){wrap.innerHTML+='<div class="hobby-tag">'+h.nama+' '+(h.detail?'('+h.detail+')':'')+' <span onclick="hapusHobby('+i+')">x</span></div>';});document.getElementById("hobbyData").value=JSON.stringify(selectedHobbies);}
function hapusHobby(i){selectedHobbies.splice(i,1);renderHobby();}
function renderAllSelect(){renderSelect('gol');renderSelect('rumah');renderSelect('alamat');renderSelect('hobby');if(document.getElementById("selectStatusKeluarga").options.length<=1){renderStatusKeluargaDropdown(false);} else {var isBaru=document.getElementById("warningKK").innerText.indexOf("KK Baru")>=0;if(!isBaru) renderSelect('status_keluarga');}}
function renderSelect(type){var id='select'+type.split('_').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join('');var select=document.getElementById(id);if(!select) return;if(type==='status_keluarga' && document.getElementById("warningKK").innerText.indexOf("KK Baru")>=0) return;var val=select.value;select.innerHTML="<option value=''>-Pilih-</option>";for(var key in kodeData[type]){select.innerHTML+='<option value="'+key+'">'+kodeData[type][key]+'</option>';}if(val) select.value=val;}
function showAdd(type){if(type==='status_keluarga' && document.getElementById("warningKK").innerText.indexOf("KK Baru")>=0){alert("KK Baru wajib Kepala Keluarga dulu Beb!");return;}var val=prompt("Tambah data baru untuk "+type.toUpperCase());if(val && val.trim() &&!kodeData[type][val.trim()]){kodeData[type][val.trim()]=val.trim();renderAllSelect();saveKodeData();}}
function showDel(type){var id='select'+type.split('_').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join('');var val=document.getElementById(id).value;if(val && confirm("Hapus: "+val+"?")){delete kodeData[type][val];renderAllSelect();saveKodeData();}}
form.addEventListener("submit",function(e){
  e.preventDefault();var formData=new FormData(this);var data={};formData.forEach(function(v,k){data[k]=v;});
  data.lunas_pangkal_lingkungan=document.getElementById('checkLunasLingkungan').checked;
  data.lunas_pangkal_kematian=document.getElementById('checkLunasKematian').checked;
  data.lunas_iuran_bulanan_ling=document.getElementById('checkLunasBulananLing').checked;
  data.lunas_iuran_bulanan_mati=document.getElementById('checkLunasBulananMati').checked;
  var tgl=data.tgl || new Date().toISOString().split('T')[0];
  if(data.lunas_pangkal_lingkungan){data.riwayat_pangkal_lingkungan={jumlah:data.pangkal_lingkungan||150000,tanggal:tgl,status:"Lunas"};}
  if(data.lunas_pangkal_kematian){data.riwayat_pangkal_kematian={jumlah:data.pangkal_kematian||50000,tanggal:tgl,status:"Lunas"};}
  var anggotaKK=dataList.filter(function(d){return d.no_kk===data.no_kk;});
  if(anggotaKK.length===0 && data.status_keluarga!=="Kepala Keluarga"){alert("KK Baru wajib Kepala Keluarga dulu Beb!");return;}
  dataList.push(data);db.ref(PATH+"/STEVEN_dataWarga").set(dataList).then(function(){filterData();resetForm();});
});
function filterData(){var no_kk=document.getElementById('searchNoKK').value.toLowerCase();var nama=document.getElementById('searchNama').value.toLowerCase();var lingk=document.getElementById('searchLingkungan').value.toLowerCase();var kel=document.getElementById('searchKelompok').value.toLowerCase();var sub=document.getElementById('searchSub').value.toLowerCase();dataFiltered=dataList.filter(function(d){return (d.no_kk||'').toLowerCase().indexOf(no_kk)>=0 && (d.nama||'').toLowerCase().indexOf(nama)>=0 && (d.lingkungan_utama||'').toLowerCase().indexOf(lingk)>=0 && (d.kelompok||'').toLowerCase().indexOf(kel)>=0 && (d.sub_lingkungan||'').toLowerCase().indexOf(sub)>=0;});renderTable();}
function renderTable(){var tbody=document.querySelector("#tabelData tbody");tbody.innerHTML="";var dataToShow=(dataFiltered.length>0 || document.getElementById('searchNoKK').value || document.getElementById('searchNama').value)?dataFiltered:dataList;dataToShow.forEach(function(d){var foto=d.foto||"https://via.placeholder.com/32/CCCCCC/FFFFFF?text=?";var indexAsli=dataList.indexOf(d);var kl=d.lunas_pangkal_lingkungan || (d.riwayat_pangkal_lingkungan && d.riwayat_pangkal_lingkungan.status==="Lunas");var kk=d.lunas_pangkal_kematian || (d.riwayat_pangkal_kematian && d.riwayat_pangkal_kematian.status==="Lunas");var ling=d.lunas_iuran_bulanan_ling;var mati=d.lunas_iuran_bulanan_mati;var statusPangkal=(kl?'<span class=badge-lunas>KL:LUNAS</span>':'<span class=badge-belum>KL:BELUM</span>')+' '+(kk?'<span class=badge-lunas>KK:LUNAS</span>':'<span class=badge-belum>KK:BELUM</span>');var statusBulanan=(ling?'<span class=badge-lunas>LING:LUNAS</span>':'<span class=badge-belum>LING:BELUM</span>')+' '+(mati?'<span class=badge-lunas>MATI:LUNAS</span>':'<span class=badge-belum>MATI:BELUM</span>');var tr=document.createElement("tr");tr.innerHTML='<td><img class="foto-tabel" src="'+foto+'" ondblclick="showModal(\''+foto+'\')"></td><td><b>'+(d.no_kk||'-')+'</b></td><td>'+d.nama+'</td><td>'+(d.status_keluarga||'-')+'</td><td>'+(d.lingkungan_utama||'-')+'</td><td>'+(d.kelompok||'-')+'</td><td style="font-size:9px">'+statusPangkal+'</td><td style="font-size:9px">'+statusBulanan+'</td><td>'+(d.hp||'-')+'</td><td><button class="btn-hapus" onclick="hapusData('+indexAsli+')">Hapus</button></td>';tr.onclick=function(e){if(e.target.tagName!=='BUTTON') loadToForm(indexAsli,tr);};tbody.appendChild(tr);});}
function hapusData(index){if(confirm("Yakin hapus: "+dataList[index].nama+"?")){dataList.splice(index,1);saveDataWarga();filterData();resetForm();}}
function showModal(src){document.getElementById('modalImg').src=src;document.getElementById('modalFoto').style.display='flex';}
function loadToForm(index,row){editIndex=index;document.querySelectorAll("#tabelData tr").forEach(function(r){r.classList.remove("selected");});row.classList.add("selected");var data=dataList[index];try{selectedHobbies=data.hobby?JSON.parse(data.hobby):[];}catch(e){selectedHobbies=[];}renderHobby();for(var key in data){if(form.elements[key] && form.elements[key].type!=='checkbox') form.elements[key].value=data[key];}document.getElementById('checkLunasLingkungan').checked=data.lunas_pangkal_lingkungan===true || data.lunas_pangkal_lingkungan==="true" || (data.riwayat_pangkal_lingkungan && data.riwayat_pangkal_lingkungan.status==="Lunas");document.getElementById('checkLunasKematian').checked=data.lunas_pangkal_kematian===true || data.lunas_pangkal_kematian==="true" || (data.riwayat_pangkal_kematian && data.riwayat_pangkal_kematian.status==="Lunas");document.getElementById('checkLunasBulananLing').checked=data.lunas_iuran_bulanan_ling===true || data.lunas_iuran_bulanan_ling==="true";document.getElementById('checkLunasBulananMati').checked=data.lunas_iuran_bulanan_mati===true || data.lunas_iuran_bulanan_mati==="true";document.getElementById("preview").src=data.foto||"https://via.placeholder.com/60/CCCCCC/FFFFFF?text=Foto";if(data.tgllahir){var ev=new Event('change');document.getElementById("tgllahir").dispatchEvent(ev);}document.getElementById("btnSimpan").style.display="none";document.getElementById("btnUpdate").style.display="block";}
document.getElementById("btnUpdate").onclick=function(){var formData=new FormData(form);var data={};formData.forEach(function(v,k){if(k!=='lunas_pangkal_lingkungan' && k!=='lunas_pangkal_kematian') data[k]=v;});data.lunas_pangkal_lingkungan=document.getElementById('checkLunasLingkungan').checked;data.lunas_pangkal_kematian=document.getElementById('checkLunasKematian').checked;data.lunas_iuran_bulanan_ling=document.getElementById('checkLunasBulananLing').checked;data.lunas_iuran_bulanan_mati=document.getElementById('checkLunasBulananMati').checked;var tgl=data.tgl||new Date().toISOString().split('T')[0];if(data.lunas_pangkal_lingkungan){data.riwayat_pangkal_lingkungan={jumlah:data.pangkal_lingkungan||150000,tanggal:tgl,status:"Lunas"};}if(data.lunas_pangkal_kematian){data.riwayat_pangkal_kematian={jumlah:data.pangkal_kematian||50000,tanggal:tgl,status:"Lunas"};}dataList[editIndex]=Object.assign({},dataList[editIndex],data);saveDataWarga();filterData();resetForm();};
document.getElementById("btnReset").onclick=resetForm;
function resetForm(){form.reset();selectedHobbies=[];renderHobby();document.getElementById("preview").src="https://via.placeholder.com/60/CCCCCC/FFFFFF?text=Foto";document.getElementById("fotoBase64").value="";document.getElementById("usia").value="";document.getElementById("warningKK").innerText="";document.getElementById("infoKK").innerText="";editIndex=-1;currentKK="";document.getElementById("btnSimpan").style.display="block";document.getElementById("btnUpdate").style.display="none";document.querySelectorAll("#tabelData tr").forEach(function(r){r.classList.remove("selected");});renderStatusKeluargaDropdown(false);document.getElementById("iuran_bulanan").value="20000";document.getElementById("iuran_kematian").value="10000";}
renderAllSelect();
</script>

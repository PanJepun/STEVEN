<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Warga STEVEN - 5 SEARCH</title>
<style>
    * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial;
    margin:0; padding:15px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height:100vh;
  }
.wrapper { display:flex; gap:15px; height:calc(100vh - 30px); }
.form-panel,.list-panel {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  padding:15px;
  border-radius:16px;
  box-shadow:0 8px 32px rgba(31, 38, 135, 0.37);
}
.form-panel { width:45%; overflow-y:auto; }
.list-panel { width:55%; display:flex; flex-direction:column; }
.form-panel h3,.list-panel h3 {
  margin:0 0 12px 0; color:#4c1d95; font-size:16px; text-align:center;
  border-bottom:2px solid #8b5cf6; padding-bottom:8px; font-weight:700;
}
.form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.full { grid-column: span 2; }
  label { font-size:11px; font-weight:600; display:block; margin-bottom:4px; color:#4b5563; }
  input, select {
    width:100%; padding:6px 8px; font-size:11px;
    border:1px solid #d1d5db; border-radius:6px; height:28px;
    background: #fff;
  }
  input:focus, select:focus {
    border-color:#8b5cf6; outline:none;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
  }

.dropdown-group { display:flex; gap:5px; align-items:center; }
.dropdown-group select { flex:1; }
.btn-plus {
  background: linear-gradient(135deg, #10b981, #059669);
  color:white; border:none; border-radius:6px; width:28px; height:28px; cursor:pointer; font-weight:bold; font-size:14px;
}
.btn-del {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color:white; border:none; border-radius:6px; width:28px; height:28px; cursor:pointer; font-weight:bold; font-size:14px;
}

.preview-img {
  width:60px; height:60px; border-radius:50%; object-fit:cover;
  border:3px solid #8b5cf6; margin:8px auto; display:block;
}

.userid-box { position:relative; }
.hint { font-size:9px; color:#6b7280; margin-top:2px; }

/* DROPDOWN FIXED */
.add-dropdown {
  position:fixed; background:white;
  border:2px solid #8b5cf6; border-radius:8px; z-index:99999;
  box-shadow:0 10px 30px rgba(139, 92, 246, 0.5); display:none;
  width:260px;
}
.add-dropdown.header {
  padding:6px; background:linear-gradient(135deg, #8b5cf6, #7c3aed);
  color:white; font-size:11px; font-weight:bold; border-radius:6px 6px 0 0;
}
.add-dropdown input {
  border:none; border-bottom:1px solid #eee; border-radius:0;
  height:28px; width:100%; padding:5px 8px; font-size:11px;
}
.add-dropdown button {
  width:100%; padding:8px; background:#10b981; color:white; border:none;
  border-radius:0 0 8px 8px; cursor:pointer; font-size:11px; font-weight:bold;
}

.btn-wrap { display:flex; gap:8px; margin-top:12px; }
.btn {
  flex:1; padding:10px; background: linear-gradient(135deg, #10b981, #059669);
  color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:12px;
}
.btn-update { background: linear-gradient(135deg, #f59e0b, #d97706); display:none; }
.btn-reset { background: linear-gradient(135deg, #64748b, #475569); }

/* UBAH JADI 5 KOLOM SEARCH */
.search-box { display:grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
.table-wrap { flex:1; overflow:auto; border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:10px; background:white; border-radius:10px; overflow:hidden; }
  th {
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    color:white; padding:7px; position:sticky; top:0; font-weight:600;
  }
  td { border-bottom:1px solid #f1f5f9; padding:5px; cursor:pointer; text-align:center; }
.foto-tabel { width:32px; height:32px; border-radius:50%; object-fit:cover; cursor:pointer; border:2px solid #e5e7eb; }
  tr:hover { background:#f5f3ff; }
  tr.selected { background:#ddd6fe!important; }
.btn-hapus {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color:white; border:none; border-radius:5px; padding:4px 7px;
    font-size:10px; font-weight:bold; cursor:pointer;
  }
.modal { display:none; position:fixed; z-index:999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; }
.modal img { max-width:90%; max-height:90%; border-radius:12px; border:4px solid white; }
.modal span { position:absolute; top:20px; right:30px; color:white; font-size:30px; cursor:pointer; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="wrapper">
  <div class="form-panel">
    <h3>FORM DATA ENTRY - STEVEN</h3>
    <form id="formWarga">
      <input type="hidden" id="editIndex" value="-1">
      <input type="hidden" id="fotoBase64" name="foto">
      <div class="form-grid">
        <div><label>Tgl Daftar</label><input type="date" name="tgl" required></div>
        <div class="userid-box">
          <label>User ID <span style="color:red;">*Ketik 4 digit + no urut</span></label>
          <input type="text" name="userid" id="userid" maxlength="8" placeholder="Contoh: 31240001" autocomplete="off">
          <div class="hint">Digit 1=Are, 2=Lingk, 3=Sub, 4=Kel, 5-8=No Urut</div>
        </div>
        <div><label>No. KTP</label><input type="text" name="nik" maxlength="16"></div>
        <div><label>Nama</label><input type="text" name="nama" required></div>
        <div class="full"><label>Alamat</label><input type="text" name="alamat"></div>
        <div><label>Lingkungan Utama</label><input type="text" name="lingkungan_utama"></div>
        <div><label>Sub Lingkungan</label><input type="text" name="sub_lingkungan"></div>
        <div><label>Tempat Lahir</label><input type="text" name="tempat"></div>
        <div><label>Tgl Lahir</label><input type="date" name="tgllahir"></div>
        <div><label>Jenis Kelamin</label><select name="jk"><option>Laki-Laki</option><option>Perempuan</option></select></div>
        <div>
          <label>Gol Darah</label>
          <div class="dropdown-group">
            <select name="gol" id="selectGol"></select>
            <button type="button" class="btn-plus" onclick="showAdd('gol')">+</button>
            <button type="button" class="btn-del" onclick="showDel('gol')">x</button>
          </div>
        </div>
        <div class="full"><label>Pekerjaan</label><input type="text" name="pekerjaan"></div>
        <div class="full"><label>Hobby</label><input type="text" name="hobby"></div>
        <div>
          <label>Status</label>
          <div class="dropdown-group">
            <select name="status" id="selectStatus"></select>
            <button type="button" class="btn-plus" onclick="showAdd('status')">+</button>
            <button type="button" class="btn-del" onclick="showDel('status')">x</button>
          </div>
        </div>
        <div><label>No. HP</label><input type="text" name="hp"></div>
        <div><label>Iuran Kel</label><input type="number" name="iuran_kel"></div>
        <div><label>Iuran Kem</label><input type="number" name="iuran_kem"></div>
        <div><label>Kelompok</label><input type="text" name="kelompok"></div>
        <div>
          <label>Status Rumah</label>
          <div class="dropdown-group">
            <select name="status_rumah" id="selectRumah"></select>
            <button type="button" class="btn-plus" onclick="showAdd('rumah')">+</button>
            <button type="button" class="btn-del" onclick="showDel('rumah')">x</button>
          </div>
        </div>
        <div class="full" style="text-align:center;">
          <label>Foto</label>
          <input type="file" id="inputFoto" accept="image/*">
          <img id="preview" class="preview-img" src="https://via.placeholder.com/60/CCCCCC/FFFFFF?text=Foto">
        </div>
      </div>
      <div class="btn-wrap">
        <button type="submit" id="btnSimpan" class="btn">+ Simpan</button>
        <button type="button" id="btnUpdate" class="btn btn-update">Update</button>
        <button type="button" id="btnReset" class="btn btn-reset">Reset</button>
      </div>
    </form>
  </div>

  <div class="list-panel">
    <h3>DATA YANG SUDAH MASUK - Klik untuk Edit</h3>
    <!-- 5 SEARCH BOX BEB -->
    <div class="search-box">
      <input type="text" id="searchUserid" placeholder="Cari User ID..." onkeyup="filterData()">
      <input type="text" id="searchNama" placeholder="Cari Nama..." onkeyup="filterData()">
      <input type="text" id="searchLingkungan" placeholder="Cari Lingkungan..." onkeyup="filterData()">
      <input type="text" id="searchKelompok" placeholder="Cari Kelompok..." onkeyup="filterData()">
      <input type="text" id="searchSub" placeholder="Cari Sub..." onkeyup="filterData()">
    </div>
    <div class="table-wrap">
      <table id="tabelData">
        <thead><tr><th>Foto</th><th>User ID</th><th>Nama</th><th>NIK</th><th>Lingk.</th><th>Sub</th><th>Kelompok</th><th>JK</th><th>Status</th><th>HP</th><th>Aksi</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- DROPDOWN USERID PINTAR -->
<div id="addDropdown" class="add-dropdown">
  <div class="header" id="dropdownHeader">TAMBAH KODE BARU</div>
  <input type="text" id="newKode" readonly style="background:#f3f4f6;">
  <input type="text" id="newKeterangan" placeholder="Isi keterangan...">
  <button type="button" id="btnTambahKode">+ Simpan Kode</button>
</div>

<div id="modalFoto" class="modal">
  <span onclick="document.getElementById('modalFoto').style.display='none'">&times;</span>
  <img id="modalImg">
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6r1mm0Fm0gIioG2UcWQZt0XJtHQj15iI",
  authDomain: "restopro2026-60038.firebaseapp.com",
  databaseURL: "https://restopro2026-60038-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restopro2026-60038"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let dataList = [];
let dataFiltered = [];
let editIndex = -1;
let kodeData = { are:{}, ling:{}, sub:{}, kel:{}, gol:{"-":"-","A":"A","B":"B","AB":"AB","O":"O"}, status:{"Single":"Single","Menikah":"Menikah"}, rumah:{"Milik Sendiri":"Milik Sendiri"} };
let currentDigit = 0;

const PATH = "STEVEN";
const form = document.getElementById("formWarga");
const useridInput = document.getElementById("userid");
const addDropdown = document.getElementById("addDropdown");

// ENTER PINDAH KOLOM
form.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const inputs = Array.from(form.querySelectorAll('input:not([type=hidden]), select, button'));
    const index = inputs.indexOf(document.activeElement);
    if (index > -1 && index < inputs.length - 1) inputs[index + 1].focus();
    else document.getElementById('btnSimpan').focus();
  }
});

db.ref(PATH + "/dataWarga").on("value", (snapshot) => {
  dataList = snapshot.val() || [];
  filterData();
});
db.ref(PATH + "/kodeData").on("value", (snapshot) => {
  let data = snapshot.val();
  if(data){ kodeData = {...kodeData,...data}; }
  renderAllSelect();
});

function saveDataWarga(){ db.ref(PATH + "/dataWarga").set(dataList); }
function saveKodeData(){ db.ref(PATH + "/kodeData").set(kodeData); }

document.getElementById("inputFoto").addEventListener("change", function(){
  let file = this.files[0];
  if(file){
    let reader = new FileReader();
    reader.onload = e => { document.getElementById("preview").src = e.target.result; document.getElementById("fotoBase64").value = e.target.result; }
    reader.readAsDataURL(file);
  }
});

// USER ID PINTAR
useridInput.addEventListener('input', function(e){
  let val = this.value.replace(/[^0-9]/g,'');
  this.value = val;
  addDropdown.style.display = 'none';
  if(val.length >= 1 && val.length <= 4){
    let posisi = val.length;
    let digit = val[posisi-1];
    cekDigit(posisi, digit, e.target);
  }
});

function cekDigit(posisi, digit, inputEl){
  if(!digit) return;
  let tipe = ['are','ling','sub','kel'][posisi-1];
  currentDigit = posisi;
  if(!kodeData[tipe] ||!kodeData[tipe][digit]){
    let rect = inputEl.getBoundingClientRect();
    addDropdown.style.top = (rect.bottom + 5) + 'px';
    addDropdown.style.left = rect.left + 'px';
    addDropdown.style.display = 'block';
    document.getElementById('newKode').value = digit;
    document.getElementById('dropdownHeader').innerText = 'TAMBAH KODE ' + tipe.toUpperCase() + ' : ' + digit;
    document.getElementById('newKeterangan').focus();
  }
}

document.getElementById('btnTambahKode').onclick = function(){
  let kode = document.getElementById('newKode').value;
  let ket = document.getElementById('newKeterangan').value;
  let tipe = ['are','ling','sub','kel'][currentDigit-1];
  if(kode && ket){
    if(!kodeData[tipe]) kodeData[tipe] = {};
    kodeData[tipe][kode] = ket;
    saveKodeData();
    addDropdown.style.display = 'none';
    document.getElementById('newKeterangan').value = '';
  }
};

document.addEventListener('click', function(e){
  if(!e.target.closest('.userid-box') &&!e.target.closest('#addDropdown')){
    addDropdown.style.display = 'none';
  }
});

// DROPDOWN GOL, STATUS, RUMAH
function renderAllSelect(){
  renderSelect('gol'); renderSelect('status'); renderSelect('rumah');
}
function renderSelect(type){
  let id = 'select' + type.charAt(0).toUpperCase() + type.slice(1);
  let select = document.getElementById(id);
  let val = select.value;
  select.innerHTML = "<option value=''>-Pilih-</option>";
  for(let key in kodeData[type]){ select.innerHTML += `<option value="${key}">${kodeData[type][key]}</option>`; }
  select.value = val;
}
function showAdd(type){
  let val = prompt("Tambah data baru untuk " + type.toUpperCase());
  if(val && val.trim() &&!kodeData[type][val.trim()]){
    kodeData[type][val.trim()] = val.trim();
    renderAllSelect();
    saveKodeData();
  }
}
function showDel(type){
  let id = 'select' + type.charAt(0).toUpperCase() + type.slice(1);
  let val = document.getElementById(id).value;
  if(val && confirm("Hapus: " + val + "?")){
    delete kodeData[type][val];
    renderAllSelect();
    saveKodeData();
  }
}

// CRUD + 5 SEARCH
form.addEventListener("submit", function(e){
  e.preventDefault();
  let formData = new FormData(this);
  let data = {};
  formData.forEach((v,k)=> data[k]=v);
  dataList.push(data);
  saveDataWarga();
  filterData();
  resetForm();
});

function filterData(){
  let userid = document.getElementById('searchUserid').value.toLowerCase();
  let nama = document.getElementById('searchNama').value.toLowerCase();
  let lingk = document.getElementById('searchLingkungan').value.toLowerCase();
  let kel = document.getElementById('searchKelompok').value.toLowerCase(); // TAMBAH
  let sub = document.getElementById('searchSub').value.toLowerCase(); // TAMBAH

  dataFiltered = dataList.filter(d =>
    (d.userid||'').toLowerCase().includes(userid) &&
    (d.nama||'').toLowerCase().includes(nama) &&
    (d.lingkungan_utama||'').toLowerCase().includes(lingk) &&
    (d.kelompok||'').toLowerCase().includes(kel) && // TAMBAH
    (d.sub_lingkungan||'').toLowerCase().includes(sub) // TAMBAH
  );
  renderTable();
}

function renderTable(){
  let tbody = document.querySelector("#tabelData tbody");
  tbody.innerHTML = "";
  let dataToShow = dataFiltered.length > 0? dataFiltered : dataList;
  dataToShow.forEach((d)=>{
    let foto = d.foto || "https://via.placeholder.com/32/CCCCCC/FFFFFF?text=?";
    let indexAsli = dataList.indexOf(d);
    let tr = document.createElement("tr");
    // TAMBAH KOLOM SUB DAN KELOMPOK DI TABEL
    tr.innerHTML = `<td><img class="foto-tabel" src="${foto}" ondblclick="showModal('${foto}')"></td>
      <td><b>${d.userid || '-'}</b></td><td>${d.nama}</td><td>${d.nik}</td><td>${d.lingkungan_utama || '-'}</td>
      <td>${d.sub_lingkungan || '-'}</td><td>${d.kelompok || '-'}</td>
      <td>${d.jk}</td><td>${d.status}</td><td>${d.hp}</td>
      <td><button class="btn-hapus" onclick="hapusData(${indexAsli})">Hapus</button></td>`;
    tr.onclick = (e) => { if(e.target.tagName!== 'BUTTON') loadToForm(indexAsli, tr); }
    tbody.appendChild(tr);
  });
}

function hapusData(index){
  if(confirm("Yakin hapus: " + dataList[index].nama + "?")){
    dataList.splice(index, 1);
    saveDataWarga();
    filterData();
    resetForm();
  }
}

function showModal(src){
  document.getElementById('modalImg').src = src;
  document.getElementById('modalFoto').style.display = 'flex';
}

function loadToForm(index, row){
  editIndex = index;
  document.querySelectorAll("#tabelData tr").forEach(r=>r.classList.remove("selected"));
  row.classList.add("selected");
  let data = dataList[index];
  for(let key in data){ if(form.elements[key]) form.elements[key].value = data[key]; }
  document.getElementById("preview").src = data.foto || "https://via.placeholder.com/60/CCCCCC/FFFFFF?text=Foto";
  document.getElementById("btnSimpan").style.display = "none";
  document.getElementById("btnUpdate").style.display = "block";
}

document.getElementById("btnUpdate").onclick = function(){
  let formData = new FormData(form);
  let data = {};
  formData.forEach((v,k)=> data[k]=v);
  dataList[editIndex] = data;
  saveDataWarga();
  filterData();
  resetForm();
}

document.getElementById("btnReset").onclick = resetForm;
function resetForm(){
  form.reset();
  document.getElementById("preview").src = "https://via.placeholder.com/60/CCCCCC/FFFFFF?text=Foto";
  document.getElementById("fotoBase64").value = "";
  editIndex = -1;
  document.getElementById("btnSimpan").style.display = "block";
  document.getElementById("btnUpdate").style.display = "none";
  document.querySelectorAll("#tabelData tr").forEach(r=>r.classList.remove("selected"));
}

renderAllSelect();
</script>
</body>
</html>
